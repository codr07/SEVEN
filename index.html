  <body>
    <!-- Global Preloader Overlay -->
    <div id="global-preloader" class="preloader-container" style="position: fixed; z-index: 99999; top: 0; left: 0;">
      <div class="preloader-content">
        <div class="fancy-spinner">
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="dot"></div>
        </div>
        <div class="preloader-progress-track">
          <div id="preloader-bar" class="preloader-progress-bar"></div>
        </div>
        <div class="preloader-info">
          <span class="preloader-text">5EVEN ROYAL PORTAL</span>
          <span id="preloader-pct" class="preloader-percentage">0%</span>
        </div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (function() {
        let currentProgress = 0;
        const bar = document.getElementById('preloader-bar');
        const pct = document.getElementById('preloader-pct');
        const preloader = document.getElementById('global-preloader');
        
        const interval = setInterval(function() {
          if (currentProgress < 90) {
            currentProgress += Math.floor(Math.random() * 8) + 2;
            if (currentProgress > 90) currentProgress = 90;
            if (bar) bar.style.width = currentProgress + '%';
            if (pct) pct.innerText = currentProgress + '%';
          }
        }, 50);

        window.finishPreloader = function() {
          clearInterval(interval);
          if (bar) bar.style.width = '100%';
          if (pct) pct.innerText = '100%';
          setTimeout(function() {
            if (preloader) {
              preloader.style.transition = 'opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
              preloader.style.opacity = '0';
              setTimeout(function() {
                preloader.remove();
              }, 600);
            }
          }, 150);
        };

        window.addEventListener('load', function() {
          window.finishPreloader();
        });

        setTimeout(function() {
          if (document.getElementById('global-preloader')) {
            window.finishPreloader();
          }
        }, 3000);
      })();
    </script>
